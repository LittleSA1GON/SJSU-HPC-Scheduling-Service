services:
  # SQLite is embedded in the app; no separate database service is needed.
  app:
    build: .
    ports: ["8080:8080"]
    volumes: ["hpc-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
volumes:
  hpc-data:
