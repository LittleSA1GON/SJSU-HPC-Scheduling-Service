spring.datasource.url=jdbc:sqlite:target/cmpe172-hpc-test-${random.uuid}.db?busy_timeout=3000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=false
spring.jackson.serialization.indent-output=true
spring.datasource.hikari.maximum-pool-size=8
hpc.time-zone=America/Los_Angeles
