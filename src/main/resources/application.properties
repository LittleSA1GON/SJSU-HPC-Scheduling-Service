spring.application.name=cmpe172-hpc-milestone1
server.port=8080

spring.datasource.url=jdbc:sqlite:cmpe172-hpc.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite foreign-key enforcement is connection-scoped. Enable it for every pooled connection.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Milestone 1 intentionally rebuilds and seeds the small demo database at startup.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=false

spring.jackson.serialization.indent-output=true
