spring.application.name=cmpe172-hpc-scheduling
server.port=8080

spring.datasource.url=jdbc:sqlite:cmpe172-hpc-milestone2.db?busy_timeout=3000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite foreign-key enforcement is connection-scoped. Enable it for every pooled connection.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Idempotent initialization preserves reservations across restarts.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=false

spring.jackson.serialization.indent-output=true
spring.datasource.hikari.maximum-pool-size=8
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
hpc.time-zone=America/Los_Angeles
